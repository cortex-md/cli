name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and release CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Validate required secrets
        env:
          CLI_GITHUB_CLIENT_ID: ${{ secrets.CLI_GITHUB_CLIENT_ID }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$CLI_GITHUB_CLIENT_ID" ]; then
            echo "::error::Missing secret CLI_GITHUB_CLIENT_ID (GitHub OAuth App client id used by cortex login)"
            exit 1
          fi
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::Missing secret NPM_TOKEN"
            exit 1
          fi

      - name: Resolve version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid tag $GITHUB_REF_NAME; use tags like v0.3.0 or v0.3.0-rc.1"
            exit 1
          fi
          NPM_TAG="latest"
          if [[ "$VERSION" == *-* ]]; then NPM_TAG="next"; fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"

      - name: Test
        run: go test ./...

      - name: Build release binaries
        env:
          GITHUB_CLIENT_ID: ${{ secrets.CLI_GITHUB_CLIENT_ID }}
        run: make release VERSION="${{ steps.version.outputs.value }}" GITHUB_CLIENT_ID="$GITHUB_CLIENT_ID"

      - name: Verify binary version
        run: ./bin/cortex-linux-amd64 --version | grep -F "v${{ steps.version.outputs.value }}"

      - name: Create archives and checksums
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist/release
          for target in darwin-arm64 darwin-amd64 linux-amd64 linux-arm64; do
            tar -czf "dist/release/cortex-${TAG}-${target}.tar.gz" -C bin "cortex-${target}"
          done
          cp bin/cortex-windows-amd64.exe "dist/release/cortex-${TAG}-windows-amd64.exe"
          (cd dist/release && sha256sum * > checksums.txt)

      - name: Build npm packages
        run: node npm/build-packages.mjs --version "${{ steps.version.outputs.value }}"

      - name: Smoke test npm install
        run: |
          PACKS="$(mktemp -d)"
          PREFIX="$(mktemp -d)"
          (cd dist/npm/cli-linux-x64 && npm pack --silent --pack-destination "$PACKS")
          (cd dist/npm/cli && npm pack --silent --pack-destination "$PACKS")
          npm install -g --prefix "$PREFIX" "$PACKS"/*.tgz
          "$PREFIX/bin/cortex" --version | grep -F "v${{ steps.version.outputs.value }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Cortex CLI ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.npm_tag == 'next' }}
          files: dist/release/*

      - name: Publish npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          publish() {
            local dir="$1"
            local name
            name="$(node -p "require('./$dir/package.json').name")"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already published"
              return
            fi
            (cd "$dir" && npm publish --provenance --access public --tag "${{ steps.version.outputs.npm_tag }}")
          }
          for dir in dist/npm/cli-*; do
            publish "$dir"
          done
          publish dist/npm/cli
